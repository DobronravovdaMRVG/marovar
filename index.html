    :root {
      --red: #C41E3A;
      --red-dark: #9B1B2E;
      --cream: #FDF8F5;
      --text: #1a1a1a;
      --muted: #666;
      --border: #eadfd9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      background: var(--red);
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .tag {
      margin-top: 4px;
      font-size: 13px;
      opacity: 0.9;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      background: var(--cream);
      padding: 12px 0;
      z-index: 10;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--red); }
    .count {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .addr {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .meta {
      font-size: 12px;
      color: var(--red);
      margin-bottom: 8px;
    }
    .links a {
      font-size: 13px;
      color: var(--red);
      text-decoration: none;
      margin-right: 14px;
    }
    .links a:hover { text-decoration: underline; }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .group-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--red);
      margin: 18px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  
    .map-banner {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px 0;
    }
    .map-banner img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

  </style>

    const citySelect = document.getElementById('city');
    const districtSelect = document.getElementById('district');
    const searchInput = document.getElementById('search');
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');

    // Заполняем города
    const citySet = [...new Set(places.map(p => p.city))].sort();
    citySet.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      citySelect.appendChild(opt);
    });

    function updateDistricts() {
      const city = citySelect.value;
      districtSelect.innerHTML = '<option value="">Все районы</option>';
      let districts = places
        .filter(p => !city || p.city === city)
        .map(p => p.district)
        .filter(d => d && d.trim());
      districts = [...new Set(districts)].sort();
      districts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
    }

    function yandexLink(p) {
      const q = encodeURIComponent(p.city + ', ' + p.address);
      return `https://yandex.ru/maps/?text=${q}`;
    }

    function render() {
      const q = searchInput.value.toLowerCase().trim();
      const city = citySelect.value;
      const district = districtSelect.value;

      const filtered = places.filter(p => {
        if (city && p.city !== city) return false;
        if (district && p.district !== district) return false;
        if (!q) return true;
        return (
          p.name.toLowerCase().includes(q) ||
          p.address.toLowerCase().includes(q) ||
          (p.district && p.district.toLowerCase().includes(q))
        );
      });

      countEl.textContent = 'Найдено: ' + filtered.length;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
      }

      // Группируем по городу
      const groups = {};
      filtered.forEach(p => {
        if (!groups[p.city]) groups[p.city] = [];
        groups[p.city].push(p);
      });

      let html = '';
      Object.keys(groups).forEach(cityName => {
        html += `<div class="group-title">${cityName}</div>`;
        groups[cityName].forEach(p => {
          html += `
            <div class="card">
              <div class="name">${p.name}</div>
              <div class="addr">${p.address}</div>
              <div class="meta">${p.district || p.city}</div>
              <div class="links">
                <a href="${yandexLink(p)}" target="_blank" rel="noopener">Яндекс.Карты</a>
              </div>
            </div>`;
        });
      });
      listEl.innerHTML = html;
    }

    searchInput.addEventListener('input', render);
    citySelect.addEventListener('change', () => {
      updateDistricts();
      render();
    });
    districtSelect.addEventListener('change', render);
    updateDistricts();
    render();
  </script>
